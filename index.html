<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transfert QR</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:24px;max-width:420px;margin:auto;text-align:center;background:#f6f7f9;color:#111}
  h1{font-size:22px}
  button,label.btn{display:inline-block;background:#2563eb;color:#fff;border:0;border-radius:12px;padding:16px 24px;font-size:18px;cursor:pointer}
  #qr{background:#fff;padding:16px;border-radius:12px;display:inline-block;margin:16px 0}
  #qr img{width:240px;height:240px}
  .bar{height:14px;background:#ddd;border-radius:7px;overflow:hidden;margin:16px 0 6px}
  .bar div{height:100%;width:0;background:#16a34a;transition:width .2s}
  .hide{display:none}
  small{color:#555}
</style>
</head>
<body>
<h1>📲 Transfert de fichier</h1>

<!-- Écran émetteur -->
<div id="sender">
  <p>1. Choisissez un fichier<br>2. Faites scanner le QR code avec l'appareil photo de l'autre téléphone</p>
  <label class="btn">Choisir un fichier
    <input id="file" type="file" hidden>
  </label>
  <div id="qrbox" class="hide">
    <div id="qr"></div>
    <p id="fname"></p>
    <small>Gardez cette page ouverte et l'écran allumé.</small>
  </div>
</div>

<!-- Écran récepteur -->
<div id="receiver" class="hide">
  <p id="rinfo">Connexion…</p>
</div>

<div id="progress" class="hide">
  <div class="bar"><div id="fill"></div></div>
  <span id="pct">0 %</span>
</div>
<p id="status"></p>

<script>
const CHUNK = 16 * 1024;
const $ = id => document.getElementById(id);
const fmt = n => n > 1e9 ? (n/1e9).toFixed(2)+' Go' : n > 1e6 ? (n/1e6).toFixed(1)+' Mo' : Math.round(n/1e3)+' Ko';
const setProgress = (done, total) => {
  $('progress').classList.remove('hide');
  const p = total ? Math.floor(done/total*100) : 0;
  $('fill').style.width = p + '%';
  $('pct').textContent = p + ' %  (' + fmt(done) + ' / ' + fmt(total) + ')';
};
const keepAwake = async () => { try { await navigator.wakeLock.request('screen'); } catch(e){} };

const targetId = location.hash.slice(1);

/* ============ RÉCEPTEUR (a scanné le QR) ============ */
if (targetId) {
  $('sender').classList.add('hide');
  $('receiver').classList.remove('hide');
  keepAwake();
  const peer = new Peer();
  peer.on('open', () => {
    const conn = peer.connect(targetId, { reliable: true, serialization: 'raw' });
    let meta, chunks = [], got = 0;
    conn.on('open', () => $('rinfo').textContent = 'Connecté, en attente du fichier…');
    conn.on('data', d => {
      if (typeof d === 'string') {
        const m = JSON.parse(d);
        if (m.type === 'meta') {
          meta = m;
          $('rinfo').textContent = '📥 ' + m.name + ' (' + fmt(m.size) + ')';
        } else if (m.type === 'end') {
          const blob = new Blob(chunks, { type: meta.mime || 'application/octet-stream' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = meta.name; a.click();
          $('status').innerHTML = '✅ Terminé ! <br><a href="'+url+'" download="'+meta.name+'">Télécharger à nouveau</a>';
        }
      } else {
        chunks.push(d);
        got += d.byteLength;
        setProgress(got, meta.size);
      }
    });
    conn.on('close', () => { if (!$('status').textContent) $('status').textContent = 'Connexion fermée.'; });
    conn.on('error', e => $('status').textContent = 'Erreur : ' + e);
  });
  peer.on('error', e => $('status').textContent = 'Erreur : ' + e.type);
}

/* ============ ÉMETTEUR ============ */
else {
  let file = null;
  const peer = new Peer();
  let peerId = null;
  peer.on('open', id => { peerId = id; if (file) showQR(); });
  peer.on('error', e => $('status').textContent = 'Erreur : ' + e.type);

  $('file').onchange = e => {
    file = e.target.files[0];
    if (!file) return;
    $('fname').textContent = '📄 ' + file.name + ' (' + fmt(file.size) + ')';
    if (peerId) showQR(); else $('status').textContent = 'Connexion au service…';
  };

  function showQR() {
    $('status').textContent = '';
    const url = location.origin + location.pathname + '#' + peerId;
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    $('qr').innerHTML = qr.createImgTag(6, 0);
    $('qrbox').classList.remove('hide');
    keepAwake();
  }

  peer.on('connection', conn => {
    conn.on('open', async () => {
      $('qrbox').classList.add('hide');
      $('status').textContent = 'Envoi en cours…';
      conn.send(JSON.stringify({ type: 'meta', name: file.name, size: file.size, mime: file.type }));
      const dc = conn.dataChannel;
      let sent = 0;
      for (let off = 0; off < file.size; off += CHUNK) {
        const buf = await file.slice(off, off + CHUNK).arrayBuffer();
        while (dc.bufferedAmount > 4 * 1024 * 1024) await new Promise(r => setTimeout(r, 20)); // évite de saturer la mémoire
        conn.send(buf);
        sent += buf.byteLength;
        if ((off / CHUNK) % 16 === 0) setProgress(sent, file.size);
      }
      while (dc.bufferedAmount > 0) await new Promise(r => setTimeout(r, 50));
      setProgress(file.size, file.size);
      conn.send(JSON.stringify({ type: 'end' }));
      $('status').textContent = '✅ Fichier envoyé !';
    });
  });
}
</script>
</body>
</html>
